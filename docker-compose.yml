# DeskPilot + hbbs (fork DeskPilot) + hbbr + PostgreSQL.
# Usage : cp .env.example .env && docker compose up -d
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: deskpilot
      POSTGRES_USER: deskpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deskpilot -d deskpilot"]
      interval: 5s
      timeout: 3s
      retries: 20

  deskpilot:
    build: .
    image: deskpilot:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=db;Database=deskpilot;Username=deskpilot;Password=${POSTGRES_PASSWORD}
      DeskPilot__AdminUsername: ${ADMIN_USERNAME:-admin}
      DeskPilot__AdminPassword: ${ADMIN_PASSWORD:-}
      DeskPilot__general__public_url: ${PUBLIC_URL:-}
      DeskPilot__HbbsSecret: ${HBBS_SECRET:?définir HBBS_SECRET dans .env}
      TZ: ${TZ:-Europe/Paris}
    ports:
      - "21114:21114"
    volumes:
      - ./data/deskpilot:/data

  # Rendezvous / ID server, DeskPilot fork (./hbbs). The key pair is generated in
  # ./data/rustdesk on first start; give id_ed25519.pub to your clients.
  hbbs:
    build:
      context: ./hbbs
      dockerfile: Dockerfile.deskpilot
    image: deskpilot-hbbs:latest
    restart: unless-stopped
    command: hbbs
    environment:
      DESKPILOT_URL: http://deskpilot:21114
      DESKPILOT_SECRET: ${HBBS_SECRET}
      DESKPILOT_FAIL_MODE: ${HBBS_FAIL_MODE:-open}
    depends_on:
      - hbbr
      - deskpilot
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21118:21118"
    volumes:
      - ./data/rustdesk:/root

  # Relay server (unchanged upstream binary, built from the same sources).
  hbbr:
    build:
      context: ./hbbs
      dockerfile: Dockerfile.deskpilot
    image: deskpilot-hbbs:latest
    restart: unless-stopped
    command: hbbr
    ports:
      - "21117:21117"
      - "21119:21119"
    volumes:
      - ./data/rustdesk:/root
